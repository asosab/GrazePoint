title: "GrazePoint"
description: "Digital PRIAS: decide what to plant, when to rotate and in which window, with your farm's soil records and NASA Earth observation."
baseurl: "/GrazePoint"
url: "https://asosab.github.io"
lang: en
langs: [en, es]
default_lang: en
timezone: America/La_Paz
markdown: kramdown

defaults:
  - scope: { path: "", type: pages }
    values: { lang: en }
  - scope: { path: "es", type: pages }
    values: { lang: es }

exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - docs
  - backend
  - .devin
  - node_modules
  - Gemfile
  - Gemfile.lock

# sitemap.xml se genera a mano (respeta robots: noindex por página)
