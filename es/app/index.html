---
layout: default
title: Mi campo
description: "Mapa de tu predio: parcelas sobre imagen satelital, suelo, rotación sugerida y ventana de siembra forrajera."
leaflet: true
body_class: app
robots: noindex
---

<div id="mapa" class="mapa-app"></div>

<!-- Barra superior -->
<header class="barra-top">
  <a class="marca" href="{{ '/es/' | relative_url }}"><img src="{{ '/assets/img/logo.png' | relative_url }}" alt="">GrazePoint</a>
  <div class="barra-der">
    {% include langswitch.html %}
    <button id="btn-cuenta" class="btn-texto">Entrar</button>
  </div>
</header>

<!-- Botones flotantes del mapa -->
<div class="fab-col">
  <button id="fab-predios" class="fab" title="Mis predios" aria-label="Mis predios">☰</button>
  <button id="fab-importar" class="fab oculto" title="Importar archivo de mapa" aria-label="Importar archivo de mapa">⤓</button>
  <button id="fab-dibujar" class="fab oculto" title="Dibujar parcela" aria-label="Dibujar parcela">✎</button>
  <button id="fab-capas" class="fab" title="Capas del mapa" aria-label="Capas del mapa">⧉</button>
  <button id="fab-tiempo" class="fab" title="Paso de tiempo" aria-label="Paso de tiempo">◷</button>
</div>
<input id="imp-archivo" class="oculto" type="file" multiple
  accept=".kml,.kmz,.zip,.shp,.dbf,.prj,.shx,.cpg,.sbn,.sbx,.geojson,.json,.gpx,.csv,.txt,.wkt,.pdf">
<button id="capa-quitar" class="btn-mini plano-quitar oculto">✕ plano</button>
<div id="dibujo-barra" class="dibujo-barra oculto">
  <span id="dibujo-aviso">Toca el mapa para marcar vértices</span>
  <button id="dibujo-deshacer" class="btn-mini">deshacer</button>
  <button id="dibujo-cerrar" class="btn-mini">cerrar</button>
  <button id="dibujo-listo" class="btn-mini principal">listo</button>
</div>

<!-- Paso de tiempo -->
<div id="tiempo-barra" class="tiempo-barra oculto">
  <button id="tiempo-prev" class="btn-mini">◀</button>
  <button id="tiempo-play" class="btn-mini">▶</button>
  <input id="tiempo-slider" class="tiempo-slider" type="range" min="0" max="12" value="6" step="1">
  <span id="tiempo-label" class="tiempo-label"></span>
  <span id="tiempo-stats" class="tiempo-stats"></span>
  <button id="tiempo-next" class="btn-mini">▶</button>
  <button id="tiempo-close" class="btn-mini">✕</button>
</div>

<!-- Sábana inferior -->
<section id="hoja" class="hoja oculto">
  <div class="hoja-asa" id="hoja-asa"></div>
  <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
</section>

<div id="toast" class="toast oculto"></div>

<script src="{{ '/assets/js/i18n.js' | relative_url }}"></script>
<script src="{{ '/assets/js/api.js' | relative_url }}"></script>
<script src="{{ '/assets/js/auth.js' | relative_url }}"></script>
<script src="{{ '/assets/js/mapa.js' | relative_url }}"></script>
<script src="{{ '/assets/js/importar.js' | relative_url }}"></script>
<script src="{{ '/assets/js/capas.js' | relative_url }}"></script>
<script src="{{ '/assets/js/tiempo.js' | relative_url }}"></script>
<script src="{{ '/assets/js/app.js' | relative_url }}"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
